AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Protected sandbox for hosting the vapi-bridgefu-connect lab inside a shared
  AWS account. Deploy with `node scripts/lab.mjs owner deploy`. Creates: a
  CodeBuild project that runs the lab CLI as a role bounded by a permissions
  boundary (lab-named resources only, two regions, small ARM instance types, no
  IAM users or keys); a gateway Lambda function URL that lets engineers with
  read access to the GitHub repository start, check, and tear down their own
  lab; a nightly reaper schedule; a delegated Route53 subzone so labs never
  touch the parent zone's records; an optional monthly budget alarm; a private
  S3 bucket for lab state; and an RSA KMS key that engineers encrypt their OWN
  Vapi private key to, so each lab uses its engineer's Vapi org and nobody else
  sees the key. Engineers never need AWS credentials and nothing runs in GitHub
  Actions.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Remote-mode gateway}
        Parameters: [LabRepository, LabRef, LabAdmins, GatewayCodeKey, MaxLabs, LabMaxAgeDays]
      - Label: {default: 'Lab DNS: delegated subzone (recommended) or an existing zone'}
        Parameters: [ParentHostedZoneId, ParentZoneName, LabSubdomain, HostedZoneId, HostedZoneName]
      - Label: {default: Guardrails}
        Parameters: [MonthlyBudgetUsd, BudgetEmail, BudgetTagValue, LabRegions]
      - Label: {default: Names}
        Parameters: [RoleName, StateBucketName]

Parameters:
  LabRepository:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: >-
      GitHub repository (owner/name) of the lab. Anyone whose GitHub token can read it may use the gateway, and the
      runner executes this repository's code at LabRef, fetched from GitHub at the start of every job.
  LabRef:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9_./-]{1,100}$'
    Description: Branch, tag, or commit the runner executes.
  LabAdmins:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9,-]*$'
    Description: Comma-separated GitHub logins that may verify or tear down any engineer's lab.
  GatewayCodeKey:
    Type: String
    Default: ''
    Description: S3 key of the packaged gateway in the state bucket (owner deploy sets it; empty skips the gateway).
  MaxLabs:
    Type: Number
    Default: 40
    MinValue: 1
    Description: Most labs that may exist at once; the gateway refuses new handles beyond it.
  LabMaxAgeDays:
    Type: Number
    Default: 3
    MinValue: 1
    Description: The nightly reaper tears down labs older than this.
  ParentHostedZoneId:
    Type: String
    Default: ''
    Description: Public zone that will delegate the lab subzone (leave empty to use HostedZoneId directly instead).
  ParentZoneName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$'
    Description: Name of that parent zone in lowercase, for example vapi-internal.com.
  LabSubdomain:
    Type: String
    Default: lab
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Subzone label; labs become bridgefu-<handle>.<LabSubdomain>.<ParentZoneName>.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Existing public zone to use when not delegating a subzone.
  HostedZoneName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$'
    Description: Lowercase name of HostedZoneId; the runner may only write records beneath it.
  MonthlyBudgetUsd:
    Type: Number
    Default: 200
    MinValue: 10
    Description: Monthly budget (USD) for the lab cost alarm; counts resources tagged Project=<BudgetTagValue>, or the whole account when BudgetTagValue is empty.
  BudgetEmail:
    Type: String
    Default: ''
    Description: Email for budget alerts at 60/80/100 percent; leave empty to skip the budget.
  BudgetTagValue:
    Type: String
    Default: vapi-bridgefu-connect
    AllowedPattern: '^$|^[A-Za-z0-9 _.:/=+@-]{1,256}$'
    Description: Value of the Project cost-allocation tag the budget counts (the lab CLI tags every stack with it). Requires the Project tag to be active in Billing; empty measures the whole account.
  LabRegions:
    Type: CommaDelimitedList
    Default: 'us-west-2,us-east-1'
    Description: Regions the runner may use for regional services (the Bridgefu release supports exactly these two).
  RoleName:
    Type: String
    Default: BridgeFuLabRunner
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
  StateBucketName:
    Type: String
    Default: ''
    Description: Leave empty for bridgefu-lab-state-<account>-<region>.

Conditions:
  HasGateway: !Not [!Equals [!Ref GatewayCodeKey, '']]
  CreateLabZone: !Not [!Equals [!Ref ParentHostedZoneId, '']]
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, '']]
  FilterBudget: !Not [!Equals [!Ref BudgetTagValue, '']]
  DefaultBucketName: !Equals [!Ref StateBucketName, '']

Resources:
  # Labs get their own zone. The runner can only change records here, never in
  # the parent zone; the parent only holds the NS delegation created below.
  LabHostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateLabZone
    Properties:
      Name: !Sub '${LabSubdomain}.${ParentZoneName}'
      HostedZoneConfig:
        Comment: vapi-bridgefu-connect lab hostnames (bridgefu-<handle>.<zone>)
      HostedZoneTags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  LabZoneDelegation:
    Type: AWS::Route53::RecordSet
    Condition: CreateLabZone
    Properties:
      HostedZoneId: !Ref ParentHostedZoneId
      Name: !Sub '${LabSubdomain}.${ParentZoneName}.'
      Type: NS
      TTL: '300'
      ResourceRecords: !GetAtt LabHostedZone.NameServers

  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [DefaultBucketName, !Sub 'bridgefu-lab-state-${AWS::AccountId}-${AWS::Region}', !Ref StateBucketName]
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
          # job progress, encrypted handouts, and verify reports
          - Id: expire-job-outputs
            Status: Enabled
            Prefix: jobs/
            ExpirationInDays: 2
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
          # repository snapshots the runner executed
          - Id: expire-source-snapshots
            Status: Enabled
            Prefix: source/
            ExpirationInDays: 60
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  # Engineers encrypt their own Vapi private key to this key's public half on
  # their laptop (scripts/lib/key_wrap.mjs); only the runner can decrypt it,
  # inside a CodeBuild job, into a per-lab secret that teardown deletes. The
  # gateway serves the public half to engineers.
  WrapKey:
    Type: AWS::KMS::Key
    Properties:
      Description: vapi-bridgefu-connect lab; wraps engineers' Vapi private keys in transit to the runner (RSA-OAEP SHA-256)
      KeySpec: RSA_3072
      KeyUsage: ENCRYPT_DECRYPT
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
          - Sid: RunnerUnwrapsKeys
            Effect: Allow
            Principal: {AWS: !GetAtt RunnerRole.Arn}
            Action: [kms:Decrypt, kms:GetPublicKey, kms:DescribeKey]
            Resource: '*'
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  WrapKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/bridgefu-lab-wrap
      TargetKeyId: !Ref WrapKey

  LabBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: bridgefu-lab-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
        CostFilters: !If
          - FilterBudget
          - TagKeyValue: [!Join ['', ['user:Project$', !Ref BudgetTagValue]]]
          - !Ref AWS::NoValue
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 60, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

  # One managed policy serves as both the runner's permissions and its
  # permissions boundary, so the runner can never exceed it even if a later
  # change attaches something broader.
  LabPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RoleName}-boundary'
      Description: Maximum permissions for the vapi-bridgefu-connect lab runner.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LabStacks
            Effect: Allow
            Action: cloudformation:*
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/bridgefu-*/*'
          - Sid: CloudFormationRead
            Effect: Allow
            Action: [cloudformation:ListStacks, cloudformation:GetTemplateSummary, cloudformation:ValidateTemplate, cloudformation:DescribeStacks]
            Resource: '*'
          - Sid: LabIamRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfilesForRole
              - iam:TagRole
              - iam:UntagRole
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListPolicyVersions
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/bridgefu-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/bridgefu-*'
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: [iam:CreateServiceLinkedRole, iam:DeleteServiceLinkedRole, iam:GetServiceLinkedRoleDeletionStatus, iam:GetRole, iam:ListRoles, iam:PutRolePolicy, iam:AttachRolePolicy, iam:DeleteRolePolicy]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'
          - Sid: NetworkComputeCertificates
            Effect: Allow
            Action: ['ec2:*', 'acm:*', 'ssm:GetParameter', 'ssm:GetParameters', 'ssm:DescribeInstanceInformation', 'ssm:GetCommandInvocation', 'ssm:ListCommands', 'ssm:ListCommandInvocations']
            Resource: '*'
          - Sid: HostCommands
            Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub 'arn:${AWS::Partition}:ssm:*:*:document/AWS-RunShellScript'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
          # Record writes are scoped by NAME, not by zone: whatever zone the request
          # targets (the lab zone, the private control zone the product creates, or
          # even the parent by mistake), only names beneath the lab zone are allowed.
          - Sid: LabZoneRecords
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/*'
            Condition:
              ForAllValues:StringLike:
                route53:ChangeResourceRecordSetsNormalizedRecordNames:
                  - !Sub
                    - '*.${ZoneName}'
                    - ZoneName: !If [CreateLabZone, !Sub '${LabSubdomain}.${ParentZoneName}', !Ref HostedZoneName]
          - Sid: DnsReads
            Effect: Allow
            Action: [route53:ListResourceRecordSets, route53:GetHostedZone, route53:GetHostedZoneCount, route53:GetDNSSEC, route53:ListQueryLoggingConfigs, route53:GetQueryLoggingConfig]
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/*'
          - Sid: DnsGlobal
            Effect: Allow
            Action: [route53:CreateHostedZone, route53:DeleteHostedZone, route53:GetChange, route53:ListHostedZones, route53:ListHostedZonesByName, route53:ListHostedZonesByVPC, route53:AssociateVPCWithHostedZone, route53:DisassociateVPCFromHostedZone, route53:ChangeTagsForResource, route53:ListTagsForResource]
            Resource: '*'
          - Sid: LabLambdas
            Effect: Allow
            Action: lambda:*
            Resource: !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:bridgefu-*'
          - Sid: LabApis
            Effect: Allow
            Action: apigateway:*
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:*::/*'
          - Sid: LabTables
            Effect: Allow
            Action: dynamodb:*
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/bridgefu-*'
          - Sid: LabSecrets
            Effect: Allow
            Action: secretsmanager:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:bridgefu/*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:bridgefu-*'
          - Sid: SecretsRandom
            Effect: Allow
            Action: secretsmanager:GetRandomPassword
            Resource: '*'
          - Sid: LabTopics
            Effect: Allow
            Action: sns:*
            Resource: !Sub 'arn:${AWS::Partition}:sns:*:${AWS::AccountId}:bridgefu-*'
          - Sid: LabBuckets
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::vapi-bridgefu-connect-lab-*'
              - !Sub 'arn:${AWS::Partition}:s3:::vapi-bridgefu-connect-lab-*/*'
              - !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}'
                - Bucket: !If [DefaultBucketName, !Sub 'bridgefu-lab-state-${AWS::AccountId}-${AWS::Region}', !Ref StateBucketName]
              - !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}/*'
                - Bucket: !If [DefaultBucketName, !Sub 'bridgefu-lab-state-${AWS::AccountId}-${AWS::Region}', !Ref StateBucketName]
          - Sid: ReleaseArtifacts
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub 'arn:${AWS::Partition}:s3:::bridgefu-vapi-awsconnect-*/*'
          - Sid: ConnectMonitoringBackup
            Effect: Allow
            Action:
              - 'connect:*'
              - 'logs:*'
              - 'cloudwatch:*'
              - 'backup:*'
              - 'backup-storage:*'
              # Amazon Connect-managed identity directories (documented create/delete-instance permissions)
              - ds:AuthorizeApplication
              - ds:UnauthorizeApplication
              - ds:CheckAlias
              - ds:CreateAlias
              - ds:CreateIdentityPoolDirectory
              - ds:DeleteDirectory
              - ds:DescribeDirectories
              - kms:CreateGrant
              - kms:RetireGrant
              - kms:ListGrants
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
              - kms:ListAliases
              - kms:ListKeys
              - kms:GetPublicKey
            Resource: '*'
          # ---- guardrails (explicit denies win over everything above) ----
          - Sid: DenyOutsideLabRegions
            Effect: Deny
            NotAction: ['iam:*', 'sts:*', 'route53:*', 'cloudfront:*', 'organizations:*', 'budgets:*', 'support:*', 'health:*', 'ce:*', 'tag:*', 's3:ListAllMyBuckets', 's3:GetBucketLocation']
            Resource: '*'
            Condition:
              StringNotEquals:
                aws:RequestedRegion: !Ref LabRegions
          - Sid: DenyLargeInstances
            Effect: Deny
            Action: ec2:RunInstances
            Resource: !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
            Condition:
              StringNotLike:
                ec2:InstanceType: [t4g.*, c7g.large, c7g.xlarge, c7g.2xlarge, m7g.large, m7g.xlarge, m7g.2xlarge]
          - Sid: DenyHumanCredentials
            Effect: Deny
            Action: [iam:CreateUser, iam:CreateAccessKey, iam:CreateLoginProfile, iam:AttachUserPolicy, iam:PutUserPolicy, iam:CreateGroup, iam:CreateSAMLProvider, iam:CreateOpenIDConnectProvider, iam:DeleteOpenIDConnectProvider, iam:UpdateOpenIDConnectProviderThumbprint, organizations:*, account:*, iam:DeleteRolePermissionsBoundary, iam:PutRolePermissionsBoundary]
            Resource: '*'
          - Sid: DenyTouchingTheSandboxItself
            Effect: Deny
            Action: ['iam:*']
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${RoleName}-boundary'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}Gateway'

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: CodeBuild runner for the vapi-bridgefu-connect lab (bounded by its own policy).
      MaxSessionDuration: 14400
      PermissionsBoundary: !Ref LabPolicy
      ManagedPolicyArns: [!Ref LabPolicy]
      # Kept out of LabPolicy (IAM caps a managed policy at 6144 characters); an
      # explicit deny binds wherever it is attached.
      Policies:
        - PolicyName: hands-off-the-gateway
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyTouchingTheGateway
                Effect: Deny
                Action: ['lambda:*', 'codebuild:*', 'events:*', 'scheduler:*']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${RoleName}Gateway'
                  - !Sub 'arn:${AWS::Partition}:codebuild:*:${AWS::AccountId}:project/${RoleName}'
                  - !Sub 'arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/${RoleName}-reaper'
              # the gateway's records, its code, and the repository snapshots are written by the gateway alone
              - Sid: DenyRewritingGatewayObjects
                Effect: Deny
                Action: [s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion, s3:PutObjectAcl]
                Resource: [!Sub '${StateBucket.Arn}/gateway/*', !Sub '${StateBucket.Arn}/source/*', !Sub '${StateBucket.Arn}/labs/*']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${RoleName}'
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/bridgefu-lab/${RoleName}'
      RetentionInDays: 14
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  # Runs one lab job (provision, verify, teardown, reap) per build. The gateway
  # passes the validated job in LAB_JOB and the repository snapshot it fetched
  # from GitHub in LAB_SOURCE_KEY; the build runs that code as the runner role.
  RunnerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref RoleName
      Description: vapi-bridgefu-connect lab runner (jobs come from the gateway)
      ServiceRole: !GetAtt RunnerRole.Arn
      TimeoutInMinutes: 300
      QueuedTimeoutInMinutes: 60
      ConcurrentBuildLimit: 20
      Artifacts: {Type: NO_ARTIFACTS}
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            install:
              runtime-versions:
                nodejs: 22
            build:
              commands:
                - aws s3 cp "s3://${LAB_STATE_BUCKET}/${LAB_SOURCE_KEY}" /tmp/lab-source.zip --only-show-errors
                - mkdir -p /tmp/lab-source && (unzip -q /tmp/lab-source.zip -d /tmp/lab-source || python3 -m zipfile -e /tmp/lab-source.zip /tmp/lab-source)
                - cd "$(find /tmp/lab-source -mindepth 1 -maxdepth 1 -type d | head -n 1)" && node scripts/lab.mjs runner
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - {Name: LAB_STATE_BUCKET, Value: !Ref StateBucket}
          - {Name: LAB_HOSTED_ZONE_ID, Value: !If [CreateLabZone, !Ref LabHostedZone, !Ref HostedZoneId]}
          - {Name: LAB_HOSTED_ZONE_NAME, Value: !If [CreateLabZone, !Sub '${LabSubdomain}.${ParentZoneName}', !Ref HostedZoneName]}
          - {Name: LAB_WRAP_KEY_ARN, Value: !GetAtt WrapKey.Arn}
          - {Name: LAB_MAX_AGE_DAYS, Value: !Ref LabMaxAgeDays}
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref RunnerLogGroup
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  GatewayRole:
    Type: AWS::IAM::Role
    Condition: HasGateway
    Properties:
      RoleName: !Sub '${RoleName}Gateway'
      Description: The remote-mode gateway Lambda of the vapi-bridgefu-connect lab.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: gateway
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StartAndWatchJobs
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt RunnerProject.Arn
              - Sid: ReadJobLogs
                Effect: Allow
                Action: logs:GetLogEvents
                Resource: !Sub '${RunnerLogGroup.Arn}'
              - Sid: ReadLabState
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub '${StateBucket.Arn}/*'
              - Sid: ListLabState
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
              - Sid: WriteGatewayRecords
                Effect: Allow
                Action: [s3:PutObject]
                Resource: [!Sub '${StateBucket.Arn}/labs/*', !Sub '${StateBucket.Arn}/source/*']
              - Sid: ServeWrapPublicKey
                Effect: Allow
                Action: kms:GetPublicKey
                Resource: !GetAtt WrapKey.Arn
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  GatewayFunction:
    Type: AWS::Lambda::Function
    Condition: HasGateway
    Properties:
      FunctionName: !Sub '${RoleName}Gateway'
      Description: Remote-mode front door of the vapi-bridgefu-connect lab (GitHub repository access gates every call).
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt GatewayRole.Arn
      Code:
        S3Bucket: !Ref StateBucket
        S3Key: !Ref GatewayCodeKey
      Environment:
        Variables:
          LAB_REPO: !Ref LabRepository
          LAB_REF: !Ref LabRef
          LAB_ADMINS: !Ref LabAdmins
          LAB_PROJECT: !Ref RunnerProject
          LAB_STATE_BUCKET: !Ref StateBucket
          LAB_WRAP_KEY_ARN: !GetAtt WrapKey.Arn
          LAB_HOSTED_ZONE_NAME: !If [CreateLabZone, !Sub '${LabSubdomain}.${ParentZoneName}', !Ref HostedZoneName]
          LAB_MAX_LABS: !Ref MaxLabs
          LAB_MAX_AGE_DAYS: !Ref LabMaxAgeDays
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasGateway
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RoleName}Gateway'
      RetentionInDays: 30
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  # Public URL; every request must carry a GitHub token that can read LabRepository.
  GatewayUrl:
    Type: AWS::Lambda::Url
    Condition: HasGateway
    Properties:
      TargetFunctionArn: !GetAtt GatewayFunction.Arn
      AuthType: NONE

  GatewayUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasGateway
    Properties:
      FunctionName: !Ref GatewayFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  GatewayUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasGateway
    Properties:
      FunctionName: !Ref GatewayFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  ReaperSchedule:
    Type: AWS::Events::Rule
    Condition: HasGateway
    Properties:
      Name: !Sub '${RoleName}-reaper'
      Description: Nightly teardown of labs older than LabMaxAgeDays.
      ScheduleExpression: cron(17 5 * * ? *)
      State: ENABLED
      Targets:
        - Id: gateway
          Arn: !GetAtt GatewayFunction.Arn
          Input: '{"action":"reap"}'

  ReaperPermission:
    Type: AWS::Lambda::Permission
    Condition: HasGateway
    Properties:
      FunctionName: !Ref GatewayFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReaperSchedule.Arn

Outputs:
  RoleArn:
    Value: !GetAtt RunnerRole.Arn
  StateBucketName:
    Value: !Ref StateBucket
  WrapKeyArn:
    Description: KMS key engineers wrap their Vapi private key to (the gateway serves its public half).
    Value: !GetAtt WrapKey.Arn
  LabHostedZoneId:
    Description: Zone the labs create their hostnames in.
    Value: !If [CreateLabZone, !Ref LabHostedZone, !Ref HostedZoneId]
  LabZoneName:
    Value: !If [CreateLabZone, !Sub '${LabSubdomain}.${ParentZoneName}', !Ref HostedZoneName]
  RunnerProject:
    Description: CodeBuild project that runs every lab job.
    Value: !Ref RunnerProject
  GatewayUrl:
    Condition: HasGateway
    Description: Remote-mode gateway; owner deploy writes it to remote-lab.json.
    Value: !GetAtt GatewayUrl.FunctionUrl
