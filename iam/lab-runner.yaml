AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Protected sandbox for hosting the vapi-bridgefu-connect lab inside a shared
  AWS account. Deploy once as an administrator. Creates: a GitHub Actions OIDC
  role that runs the lab CLI, bounded by a permissions boundary (lab-named
  resources only, two regions, small ARM instance types, no IAM users or keys);
  a delegated Route53 subzone so labs never touch the parent zone's records; an
  optional monthly budget alarm; a private S3 bucket for lab state; and an RSA
  KMS key that engineers encrypt their OWN Vapi private key to, so each lab
  uses its engineer's Vapi org and nobody else sees the key. Engineers never
  need AWS credentials; the nightly reaper workflow removes stale labs.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: GitHub trust}
        Parameters: [GitHubRepository, GitHubRefSuffix, CreateOidcProvider]
      - Label: {default: 'Lab DNS: delegated subzone (recommended) or an existing zone'}
        Parameters: [ParentHostedZoneId, ParentZoneName, LabSubdomain, HostedZoneId, HostedZoneName]
      - Label: {default: Guardrails}
        Parameters: [MonthlyBudgetUsd, BudgetEmail, BudgetTagValue, LabRegions]
      - Label: {default: Names}
        Parameters: [RoleName, StateBucketName]

Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.-]+(@[0-9]+)?/[A-Za-z0-9_.-]+(@[0-9]+)?$'
    Description: >-
      Repository whose workflows may assume the role, exactly as GitHub writes it in the token subject.
      Run `gh api repos/OWNER/REPO/actions/oidc/customization/sub`: when use_immutable_subject is true, copy
      the part after `repo:` from sub_claim_prefix (owner@ownerId/name@repoId); otherwise plain owner/name.
  GitHubRefSuffix:
    Type: String
    Default: '*'
    Description: Subject suffix after repo:<owner>/<name>:. Keep * for any branch; ref:refs/heads/main restricts to main.
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: false if this account already has the token.actions.githubusercontent.com provider.
  ParentHostedZoneId:
    Type: String
    Default: ''
    Description: Public zone that will delegate the lab subzone (leave empty to use HostedZoneId directly instead).
  ParentZoneName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$'
    Description: Name of that parent zone in lowercase, for example vapi-internal.com.
  LabSubdomain:
    Type: String
    Default: lab
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Subzone label; labs become bridgefu-<handle>.<LabSubdomain>.<ParentZoneName>.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Existing public zone to use when not delegating a subzone.
  HostedZoneName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$'
    Description: Lowercase name of HostedZoneId; the runner may only write records beneath it.
  MonthlyBudgetUsd:
    Type: Number
    Default: 200
    MinValue: 10
    Description: Monthly budget (USD) for the lab cost alarm; counts resources tagged Project=<BudgetTagValue>, or the whole account when BudgetTagValue is empty.
  BudgetEmail:
    Type: String
    Default: ''
    Description: Email for budget alerts at 60/80/100 percent; leave empty to skip the budget.
  BudgetTagValue:
    Type: String
    Default: vapi-bridgefu-connect
    AllowedPattern: '^$|^[A-Za-z0-9 _.:/=+@-]{1,256}$'
    Description: Value of the Project cost-allocation tag the budget counts (the lab CLI tags every stack with it). Requires the Project tag to be active in Billing; empty measures the whole account.
  LabRegions:
    Type: CommaDelimitedList
    Default: 'us-west-2,us-east-1'
    Description: Regions the runner may use for regional services (the Bridgefu release supports exactly these two).
  RoleName:
    Type: String
    Default: BridgeFuLabRunner
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
  StateBucketName:
    Type: String
    Default: ''
    Description: Leave empty for bridgefu-lab-state-<account>-<region>.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']
  CreateLabZone: !Not [!Equals [!Ref ParentHostedZoneId, '']]
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, '']]
  FilterBudget: !Not [!Equals [!Ref BudgetTagValue, '']]
  DefaultBucketName: !Equals [!Ref StateBucketName, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Labs get their own zone. The runner can only change records here, never in
  # the parent zone; the parent only holds the NS delegation created below.
  LabHostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateLabZone
    Properties:
      Name: !Sub '${LabSubdomain}.${ParentZoneName}'
      HostedZoneConfig:
        Comment: vapi-bridgefu-connect lab hostnames (bridgefu-<handle>.<zone>)
      HostedZoneTags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  LabZoneDelegation:
    Type: AWS::Route53::RecordSet
    Condition: CreateLabZone
    Properties:
      HostedZoneId: !Ref ParentHostedZoneId
      Name: !Sub '${LabSubdomain}.${ParentZoneName}.'
      Type: NS
      TTL: '300'
      ResourceRecords: !GetAtt LabHostedZone.NameServers

  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [DefaultBucketName, !Sub 'bridgefu-lab-state-${AWS::AccountId}-${AWS::Region}', !Ref StateBucketName]
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  # Engineers encrypt their own Vapi private key to this key's public half on
  # their laptop (scripts/lib/key_wrap.mjs); only the runner can decrypt it,
  # inside a workflow run, into a per-lab secret that teardown deletes.
  WrapKey:
    Type: AWS::KMS::Key
    Properties:
      Description: vapi-bridgefu-connect lab; wraps engineers' Vapi private keys in transit to the runner (RSA-OAEP SHA-256)
      KeySpec: RSA_3072
      KeyUsage: ENCRYPT_DECRYPT
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
          - Sid: RunnerUnwrapsKeys
            Effect: Allow
            Principal: {AWS: !GetAtt RunnerRole.Arn}
            Action: [kms:Decrypt, kms:GetPublicKey, kms:DescribeKey]
            Resource: '*'
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

  WrapKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/bridgefu-lab-wrap
      TargetKeyId: !Ref WrapKey

  LabBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: bridgefu-lab-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
        CostFilters: !If
          - FilterBudget
          - TagKeyValue: [!Join ['', ['user:Project$', !Ref BudgetTagValue]]]
          - !Ref AWS::NoValue
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 60, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

  # One managed policy serves as both the runner's permissions and its
  # permissions boundary, so the runner can never exceed it even if a later
  # change attaches something broader.
  LabPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RoleName}-boundary'
      Description: Maximum permissions for the vapi-bridgefu-connect lab runner.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LabStacks
            Effect: Allow
            Action: cloudformation:*
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/bridgefu-*/*'
          - Sid: CloudFormationRead
            Effect: Allow
            Action: [cloudformation:ListStacks, cloudformation:GetTemplateSummary, cloudformation:ValidateTemplate, cloudformation:DescribeStacks]
            Resource: '*'
          - Sid: LabIamRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfilesForRole
              - iam:TagRole
              - iam:UntagRole
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListPolicyVersions
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/bridgefu-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/bridgefu-*'
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: [iam:CreateServiceLinkedRole, iam:DeleteServiceLinkedRole, iam:GetServiceLinkedRoleDeletionStatus, iam:GetRole, iam:ListRoles, iam:PutRolePolicy, iam:AttachRolePolicy, iam:DeleteRolePolicy]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'
          - Sid: NetworkComputeCertificates
            Effect: Allow
            Action: ['ec2:*', 'acm:*', 'ssm:GetParameter', 'ssm:GetParameters', 'ssm:DescribeInstanceInformation', 'ssm:GetCommandInvocation', 'ssm:ListCommands', 'ssm:ListCommandInvocations']
            Resource: '*'
          - Sid: HostCommands
            Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub 'arn:${AWS::Partition}:ssm:*:*:document/AWS-RunShellScript'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
          # Record writes are scoped by NAME, not by zone: whatever zone the request
          # targets (the lab zone, the private control zone the product creates, or
          # even the parent by mistake), only names beneath the lab zone are allowed.
          - Sid: LabZoneRecords
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/*'
            Condition:
              ForAllValues:StringLike:
                route53:ChangeResourceRecordSetsNormalizedRecordNames:
                  - !Sub
                    - '*.${ZoneName}'
                    - ZoneName: !If [CreateLabZone, !Sub '${LabSubdomain}.${ParentZoneName}', !Ref HostedZoneName]
          - Sid: DnsReads
            Effect: Allow
            Action: [route53:ListResourceRecordSets, route53:GetHostedZone, route53:GetHostedZoneCount, route53:GetDNSSEC]
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/*'
          - Sid: DnsGlobal
            Effect: Allow
            Action: [route53:CreateHostedZone, route53:DeleteHostedZone, route53:GetChange, route53:ListHostedZones, route53:ListHostedZonesByName, route53:ListHostedZonesByVPC, route53:AssociateVPCWithHostedZone, route53:DisassociateVPCFromHostedZone, route53:ChangeTagsForResource, route53:ListTagsForResource]
            Resource: '*'
          - Sid: LabLambdas
            Effect: Allow
            Action: lambda:*
            Resource: !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:bridgefu-*'
          - Sid: LabApis
            Effect: Allow
            Action: apigateway:*
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:*::/*'
          - Sid: LabTables
            Effect: Allow
            Action: dynamodb:*
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/bridgefu-*'
          - Sid: LabSecrets
            Effect: Allow
            Action: secretsmanager:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:bridgefu/*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:bridgefu-*'
          - Sid: SecretsRandom
            Effect: Allow
            Action: secretsmanager:GetRandomPassword
            Resource: '*'
          - Sid: LabTopics
            Effect: Allow
            Action: sns:*
            Resource: !Sub 'arn:${AWS::Partition}:sns:*:${AWS::AccountId}:bridgefu-*'
          - Sid: LabBuckets
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::vapi-bridgefu-connect-lab-*'
              - !Sub 'arn:${AWS::Partition}:s3:::vapi-bridgefu-connect-lab-*/*'
              - !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}'
                - Bucket: !If [DefaultBucketName, !Sub 'bridgefu-lab-state-${AWS::AccountId}-${AWS::Region}', !Ref StateBucketName]
              - !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}/*'
                - Bucket: !If [DefaultBucketName, !Sub 'bridgefu-lab-state-${AWS::AccountId}-${AWS::Region}', !Ref StateBucketName]
          - Sid: ReleaseArtifacts
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub 'arn:${AWS::Partition}:s3:::bridgefu-vapi-awsconnect-*/*'
          - Sid: ConnectMonitoringBackup
            Effect: Allow
            Action:
              - 'connect:*'
              - 'logs:*'
              - 'cloudwatch:*'
              - 'backup:*'
              - 'backup-storage:*'
              # Amazon Connect-managed identity directories (documented create/delete-instance permissions)
              - ds:AuthorizeApplication
              - ds:UnauthorizeApplication
              - ds:CheckAlias
              - ds:CreateAlias
              - ds:CreateIdentityPoolDirectory
              - ds:DeleteDirectory
              - ds:DescribeDirectories
              - kms:CreateGrant
              - kms:RetireGrant
              - kms:ListGrants
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
              - kms:ListAliases
              - kms:ListKeys
              - kms:GetPublicKey
            Resource: '*'
          # ---- guardrails (explicit denies win over everything above) ----
          - Sid: DenyOutsideLabRegions
            Effect: Deny
            NotAction: ['iam:*', 'sts:*', 'route53:*', 'cloudfront:*', 'organizations:*', 'budgets:*', 'support:*', 'health:*', 'ce:*', 'tag:*', 's3:ListAllMyBuckets', 's3:GetBucketLocation']
            Resource: '*'
            Condition:
              StringNotEquals:
                aws:RequestedRegion: !Ref LabRegions
          - Sid: DenyLargeInstances
            Effect: Deny
            Action: ec2:RunInstances
            Resource: !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
            Condition:
              StringNotLike:
                ec2:InstanceType: [t4g.*, c7g.large, c7g.xlarge, c7g.2xlarge, m7g.large, m7g.xlarge, m7g.2xlarge]
          - Sid: DenyHumanCredentials
            Effect: Deny
            Action: [iam:CreateUser, iam:CreateAccessKey, iam:CreateLoginProfile, iam:AttachUserPolicy, iam:PutUserPolicy, iam:CreateGroup, iam:CreateSAMLProvider, iam:CreateOpenIDConnectProvider, iam:DeleteOpenIDConnectProvider, iam:UpdateOpenIDConnectProviderThumbprint, organizations:*, account:*, iam:DeleteRolePermissionsBoundary, iam:PutRolePermissionsBoundary]
            Resource: '*'
          - Sid: DenyTouchingTheSandboxItself
            Effect: Deny
            Action: ['iam:*']
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${RoleName}-boundary'

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: GitHub Actions runner for the vapi-bridgefu-connect lab (bounded by its own policy).
      MaxSessionDuration: 14400
      PermissionsBoundary: !Ref LabPolicy
      ManagedPolicyArns: [!Ref LabPolicy]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:${GitHubRefSuffix}'
      Tags:
        - {Key: Project, Value: vapi-bridgefu-connect}

Outputs:
  RoleArn:
    Value: !GetAtt RunnerRole.Arn
  StateBucketName:
    Value: !Ref StateBucket
  WrapKeyArn:
    Description: KMS key engineers wrap their Vapi private key to (workflow variable LAB_WRAP_KEY_ARN).
    Value: !GetAtt WrapKey.Arn
  LabHostedZoneId:
    Description: Zone the labs create their hostnames in.
    Value: !If [CreateLabZone, !Ref LabHostedZone, !Ref HostedZoneId]
  LabZoneName:
    Value: !If [CreateLabZone, !Sub '${LabSubdomain}.${ParentZoneName}', !Ref HostedZoneName]
  PublishPublicKeyCommand:
    Description: Publishes the wrap key's public half as a repository variable so engineers can wrap their key without AWS access.
    Value: !Sub 'gh variable set LAB_WRAP_PUBLIC_KEY --body "$(aws kms get-public-key --region ${AWS::Region} --key-id ${WrapKey.Arn} --query PublicKey --output text)"'
  GitHubVariables:
    Description: Repository variables the workflows read (set with gh variable set NAME --body VALUE).
    Value: !Sub
      - 'AWS_LAB_ROLE_ARN=${RunnerRole.Arn} AWS_LAB_REGION=${AWS::Region} LAB_STATE_BUCKET=${StateBucket} LAB_HOSTED_ZONE_ID=${Zone} LAB_HOSTED_ZONE_NAME=${ZoneName} LAB_WRAP_KEY_ARN=${WrapKey.Arn} LAB_MAX_AGE_DAYS=3'
      - Zone: !If [CreateLabZone, !Ref LabHostedZone, !Ref HostedZoneId]
        ZoneName: !If [CreateLabZone, !Sub '${LabSubdomain}.${ParentZoneName}', !Ref HostedZoneName]
