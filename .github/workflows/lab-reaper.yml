name: Lab reaper

# Nightly: tear down labs whose saved state is older than LAB_MAX_AGE_DAYS so a
# shared account never accumulates forgotten EC2 gateways.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: lab-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LAB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_LAB_REGION }}
          role-duration-seconds: 14400
      - name: Reap stale labs
        run: |
          extra=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ] && extra="--dry-run"
          node scripts/lab.mjs reap --bucket "${{ vars.LAB_STATE_BUCKET }}" --max-age-days "${{ vars.LAB_MAX_AGE_DAYS || '3' }}" --yes $extra
