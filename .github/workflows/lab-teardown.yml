name: Lab teardown

on:
  workflow_dispatch:
    inputs:
      engineer:
        description: "Handle used at provision time"
        required: true
        type: string
      keep_connect:
        description: "leave the Connect lab instance in place"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: lab-${{ inputs.engineer }}
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LAB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_LAB_REGION }}
          role-duration-seconds: 7200
      - name: Restore saved state
        run: node scripts/lab.mjs state pull --bucket "${{ vars.LAB_STATE_BUCKET }}" --deployment "${{ inputs.engineer }}"
      - name: Teardown
        run: |
          extra=""
          [ "${{ inputs.keep_connect }}" = "true" ] && extra="--keep-connect"
          node scripts/lab.mjs teardown --yes --keep-vapi-secret $extra
      - name: Forget the lab
        run: node scripts/lab.mjs state delete --bucket "${{ vars.LAB_STATE_BUCKET }}" --deployment "${{ inputs.engineer }}"
      - name: Keep partial state for a retry
        if: failure()
        run: node scripts/lab.mjs state push --bucket "${{ vars.LAB_STATE_BUCKET }}" --deployment "${{ inputs.engineer }}" || true
