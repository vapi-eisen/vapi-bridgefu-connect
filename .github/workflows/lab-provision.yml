name: Lab provision

# Stands up one engineer's lab in the owner's AWS account with the lab CLI and
# publishes a handout the engineer imports locally. The engineer's OWN Vapi
# private key arrives wrapped (RSA-OAEP to the sandbox KMS key, see
# scripts/lib/key_wrap.mjs) and is unwrapped into a per-lab secret that teardown
# deletes. Needs the repository variables listed in docs/09-remote-lab.md;
# assumes the BridgeFuLabRunner role through GitHub OIDC, so no long-lived AWS
# keys exist anywhere.
on:
  workflow_dispatch:
    inputs:
      engineer:
        description: "Short handle: 3-24 lowercase letters, digits, hyphens. Becomes the deployment id and bridgefu-<handle>.<zone>."
        required: true
        type: string
      vapi_key_wrapped:
        description: "Output of: node scripts/lab.mjs key wrap --engineer <handle>  (your Vapi private key encrypted to the lab account; NEVER paste a raw key)"
        required: true
        type: string
      stages:
        description: "phone = Connect + Bridgefu + Vapi number; full = phone + browser path"
        type: choice
        options: [phone, full]
        default: phone
      client_cidr:
        description: "Your public IPv4 as x.x.x.x/32 (required for full; get it with: curl -s https://checkip.amazonaws.com)"
        type: string
        default: ""
      area_code:
        description: "US area code for the free Vapi number"
        type: string
        default: "415"
      agent_auto_accept:
        description: "true auto-answers the Connect agent (solo testing)"
        type: choice
        options: ["true", "false"]
        default: "true"
      connect_alias:
        description: "Optional explicit Connect alias (use when a previous lab held <handle>-connect)"
        type: string
        default: ""
      passphrase:
        description: "Optional passphrase (8+ chars) to encrypt the handout artifact; import with state import --passphrase-env"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: lab-${{ inputs.engineer }}
  cancel-in-progress: false

env:
  ENGINEER: ${{ inputs.engineer }}
  LAB_STATE_BUCKET: ${{ vars.LAB_STATE_BUCKET }}
  LAB_HOSTED_ZONE_ID: ${{ vars.LAB_HOSTED_ZONE_ID }}
  LAB_HOSTED_ZONE_NAME: ${{ vars.LAB_HOSTED_ZONE_NAME }}
  LAB_WRAP_KEY_ARN: ${{ vars.LAB_WRAP_KEY_ARN }}
  AWS_REGION: ${{ vars.AWS_LAB_REGION }}

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LAB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_LAB_REGION }}
          role-duration-seconds: 14400
      - name: Validate inputs
        env:
          WRAPPED: ${{ inputs.vapi_key_wrapped }}
          STAGES: ${{ inputs.stages }}
          CLIENT_CIDR: ${{ inputs.client_cidr }}
        run: |
          [[ "$ENGINEER" =~ ^[a-z][a-z0-9-]{2,23}$ ]] || { echo "engineer must be 3-24 lowercase letters, digits, hyphens"; exit 1; }
          if [[ "$WRAPPED" =~ ^[0-9a-fA-F-]{36}$ ]]; then echo "vapi_key_wrapped looks like a RAW Vapi key. Rotate it now (workflow inputs are visible to collaborators) and pass the output of: node scripts/lab.mjs key wrap --engineer $ENGINEER"; exit 1; fi
          [[ "$WRAPPED" =~ ^[A-Za-z0-9+/=]{256,}$ ]] || { echo "vapi_key_wrapped must be the ciphertext printed by: node scripts/lab.mjs key wrap"; exit 1; }
          if [ "$STAGES" = "full" ] && [ -z "$CLIENT_CIDR" ]; then echo "client_cidr is required for the full lab"; exit 1; fi
      - name: Restore saved state
        run: node scripts/lab.mjs state pull --bucket "$LAB_STATE_BUCKET" --deployment "$ENGINEER" --if-exists
      - name: Unwrap the Vapi key into this lab's secret
        env:
          LAB_WRAPPED_KEY: ${{ inputs.vapi_key_wrapped }}
        run: node scripts/lab.mjs key unwrap --engineer "$ENGINEER" --key-arn "$LAB_WRAP_KEY_ARN" --region "$AWS_REGION"
      - name: Preflight
        run: |
          node scripts/lab.mjs preflight --region "$AWS_REGION" --deployment-id "$ENGINEER" \
            --hosted-zone-id "$LAB_HOSTED_ZONE_ID" --sip-hostname "bridgefu-$ENGINEER.$LAB_HOSTED_ZONE_NAME" \
            ${CONNECT_ALIAS:+--connect-alias "$CONNECT_ALIAS"}
        env:
          CONNECT_ALIAS: ${{ inputs.connect_alias }}
      - name: Stage 1 Amazon Connect
        run: node scripts/lab.mjs connect --yes --agent-auto-accept "${{ inputs.agent_auto_accept }}"
      - name: Stage 2 Bridgefu
        run: node scripts/lab.mjs bridgefu --yes
      - name: Stage 3 Vapi wiring
        run: node scripts/lab.mjs vapi --yes --area-code "${{ inputs.area_code }}"
      - name: Stage 5 browser path
        if: inputs.stages == 'full'
        run: node scripts/lab.mjs web-setup --yes --client-cidr "${{ inputs.client_cidr }}"
      - name: Save state
        if: always()
        run: node scripts/lab.mjs state push --bucket "$LAB_STATE_BUCKET" --deployment "$ENGINEER"
      - name: Write the handout
        env:
          HANDOUT_PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          extra=""
          [ "${{ inputs.stages }}" = "full" ] && extra="--with-web-bearer"
          [ -n "$HANDOUT_PASSPHRASE" ] && extra="$extra --passphrase-env HANDOUT_PASSPHRASE"
          node scripts/lab.mjs state export --out handout.json $extra
      - uses: actions/upload-artifact@v4
        with:
          name: lab-handout-${{ inputs.engineer }}
          path: handout.json
          retention-days: 2
          if-no-files-found: error
      - name: Summary
        if: always()
        run: |
          {
            echo "## Lab ${ENGINEER}"
            echo '```'
            node scripts/lab.mjs status --no-aws || true
            echo '```'
            echo "Import the handout locally: node scripts/lab.mjs remote handout --engineer ${ENGINEER}   (add --passphrase-env VAR if you set a passphrase)"
          } >> "$GITHUB_STEP_SUMMARY"
