name: Lab verify

# Runs verify-phone or verify-web against an engineer's lab and prints the report
# in the job summary, for engineers who have no AWS access of their own.
on:
  workflow_dispatch:
    inputs:
      engineer:
        description: "Handle used at provision time"
        required: true
        type: string
      mode:
        type: choice
        options: [phone, web]
        default: phone
      since_minutes:
        type: string
        default: "30"
      session_id:
        description: "web only: session id shown on the demo page (optional)"
        type: string
        default: ""
      reveal:
        description: "print raw correlation ids"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: lab-${{ inputs.engineer }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LAB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_LAB_REGION }}
      - name: Restore saved state
        run: node scripts/lab.mjs state pull --bucket "${{ vars.LAB_STATE_BUCKET }}" --deployment "${{ inputs.engineer }}"
      - name: Verify
        run: |
          args="--since-minutes ${{ inputs.since_minutes }}"
          [ "${{ inputs.reveal }}" = "true" ] && args="$args --reveal"
          [ -n "${{ inputs.session_id }}" ] && args="$args --session-id ${{ inputs.session_id }}"
          {
            echo "## verify-${{ inputs.mode }} for ${{ inputs.engineer }}"
            echo '```'
            node scripts/lab.mjs verify-${{ inputs.mode }} $args 2>&1 | tee verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-verify-${{ inputs.engineer }}-${{ inputs.mode }}
          path: verify.log
          retention-days: 2
          if-no-files-found: warn
